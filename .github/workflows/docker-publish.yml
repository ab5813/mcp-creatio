name: Docker Build and Publish

on:
    push:
        branches: ['main']
        tags: ['v*.*.*']
    workflow_dispatch:

jobs:
    docker:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # Forks / downstream repos have no Docker Hub secrets: still BUILD the
            # image (a real check that the Dockerfile works) but skip login + push.
            - name: Detect Docker Hub credentials
              id: creds
              shell: bash
              run: |
                  if [[ -n "${{ secrets.DOCKER_USERNAME }}" && -n "${{ secrets.DOCKER_PASSWORD }}" ]]; then
                    echo "available=true" >> $GITHUB_OUTPUT
                  else
                    echo "available=false" >> $GITHUB_OUTPUT
                    echo "No Docker Hub credentials — building without publishing." >> $GITHUB_STEP_SUMMARY
                  fi

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Docker Hub login
              if: steps.creds.outputs.available == 'true'
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            # Every build is also published to this repository's own GitHub Container Registry
            # (no extra secrets — GITHUB_TOKEN). Besides the moving `latest`, each image gets
            # immutable tags (vX.Y.Z and sha-<commit>) so a deployment can pin exactly one build
            # instead of re-pulling a mutable tag that a node may have cached.
            - name: GHCR login
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Compute Docker tags from package.json
              id: vars
              shell: bash
              run: |
                  VERSION=$(jq -r .version package.json)
                  if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
                    echo "Package version is empty" >&2
                    exit 1
                  fi
                  GHCR="ghcr.io/${GITHUB_REPOSITORY,,}"
                  SHORT="${GITHUB_SHA::7}"
                  TAGS="${GHCR}:latest,${GHCR}:v${VERSION},${GHCR}:sha-${SHORT}"
                  if [[ "${{ steps.creds.outputs.available }}" == "true" ]]; then
                    TAGS="${TAGS},crackish/mcp-creatio:latest,crackish/mcp-creatio:v${VERSION}"
                  fi
                  echo "tags=${TAGS}" >> $GITHUB_OUTPUT
                  echo "Image tags: ${TAGS}" >> $GITHUB_STEP_SUMMARY

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.vars.outputs.tags }}
                  build-args: |
                      GIT_SHA=${{ github.sha }}

            # Sync the repo README to the Docker Hub repository "Overview" (it is NOT
            # auto-populated from GitHub). Reuses the same Docker Hub credentials.
            - name: Update Docker Hub overview
              if: steps.creds.outputs.available == 'true'
              uses: peter-evans/dockerhub-description@v5
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}
                  repository: crackish/mcp-creatio
                  readme-filepath: ./README.md
                  short-description: 'MCP server for Creatio CRM (DataService/OData) for Claude, ChatGPT & Copilot'
